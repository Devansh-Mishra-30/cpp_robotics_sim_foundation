ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.2

    print_diagnostics: true
    debug: false

    publish_tf: false
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # State order:
    # x, y, z,
    # roll, pitch, yaw,
    # vx, vy, vz,
    # vroll, vpitch, vyaw,
    # ax, ay, az

    odom0: /diff_drive_controller/odom

    odom0_config:
      [false, false, false,
       false, false, false,
       true,  false, false,
       false, false, true,
       false, false, false]

    odom0_queue_size: 20
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data

    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]

    imu0_queue_size: 50
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false