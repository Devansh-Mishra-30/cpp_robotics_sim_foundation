name: ROS 2 Jazzy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test ROS 2 workspace
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 apt repository
        run: |
          sudo apt update
          sudo apt install -y software-properties-common curl gnupg lsb-release
          sudo add-apt-repository -y universe
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt update

      - name: Install ROS 2 Jazzy and build tools
        run: |
          sudo apt install -y \
            ros-jazzy-ros-base \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            ros-jazzy-ament-cmake-gtest \
            ros-jazzy-ament-lint-auto

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      - name: Install package dependencies with rosdep
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y --rosdistro jazzy

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --cmake-args -DBUILD_TESTING=ON

      - name: Run tests
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon test --packages-select cpp_robotics_sim_ros --event-handlers console_direct+
          colcon test-result --verbose

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-logs
          path: ros2_ws/log/
